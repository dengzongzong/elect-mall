name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # CRMEB PHP Backend
    - name: Set up PHP 7.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: json, curl, bcmath, mbstring, zip, simplexml, gd, pdo, pdo_mysql
        tools: composer:v2

    - name: Install CRMEB PHP Dependencies
      run: |
        cd crmeb
        composer install --no-dev --optimize-autoloader --no-interaction

    - name: Prepare CRMEB Environment
      run: |
        cd crmeb
        cp .env.example .env 2>/dev/null || true
        chmod -R 777 runtime
        chmod -R 777 crmeb
        chmod -R 777 public

    # Mall Web Frontend (Vue 3)
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: mall-web/package-lock.json

    - name: Build Mall Web
      run: |
        cd mall-web
        npm install
        npm run build
        ls dist/

    # Admin Web Frontend (Vue 3)
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: admin-web/package-lock.json

    - name: Build Admin Web
      run: |
        cd admin-web
        npm install
        npm run build
        ls dist/

    # Upload artifacts
    - name: Upload CRMEB Backend
      uses: actions/upload-artifact@v4
      with:
        name: crmeb-backend
        path: crmeb/

    - name: Upload Mall Web
      uses: actions/upload-artifact@v4
      with:
        name: mall-web-dist
        path: mall-web/dist/

    - name: Upload Admin Web
      uses: actions/upload-artifact@v4
      with:
        name: admin-web-dist
        path: admin-web/dist/