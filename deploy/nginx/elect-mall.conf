# =============================================================
#  elect-mall 生产环境 nginx 配置
#
#  使用前替换以下占位：
#    www.example.com      -> 你的商城域名
#    admin.example.com    -> 你的后台域名
#    /var/www/elect-mall  -> 项目在服务器上的实际路径
#
#  说明：
#    - 商城(mall-web) 用 hash 路由，直接静态托管即可。
#    - 后台(admin-web) 用 history 路由，必须 try_files 回退 index.html。
#    - 后台的接口前缀是 /admin，与后台自身页面路径共用域名会冲突，
#      因此后台必须独立域名（或独立端口），不要挂成 www 域名的 /admin 子路径。
#    - 本站 API 由 PHP 后端提供，这里统一反向代理到 127.0.0.1:8000
#      （PHP 内置服务器方式）。若改用 php-fpm，见文件末尾的替换片段。
# =============================================================

# ---------------- 商城前端 www.example.com ----------------
server {
    listen 80;
    server_name www.example.com example.com;

    root /var/www/elect-mall/mall-web/dist;
    index index.html;

    access_log /var/log/nginx/elect-mall-mall.access.log;
    error_log  /var/log/nginx/elect-mall-mall.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 构建产物带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 接口代理： /api/xxx  ->  PHP 后端 /api/adapter/xxx
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/adapter/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # hash 路由，兜底首页
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------- 管理后台 admin.example.com ----------------
server {
    listen 80;
    server_name admin.example.com;

    root /var/www/elect-mall/admin-web/dist;
    index index.html;

    access_log /var/log/nginx/elect-mall-admin.access.log;
    error_log  /var/log/nginx/elect-mall-admin.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后台若限制内网访问，可打开下面几行（按实际内网段调整）
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny  all;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台接口代理： /admin/xxx  ->  PHP 后端 /admin/adapter/xxx
    # 必须写在 location / 之前
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/adapter/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # history 路由：找不到文件时回退到 index.html，避免刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================
#  附：改用 php-fpm 时，把上面的 location /api/ 与 /admin/ 换成下面形式
#  （同时 PHP 后端不再需要常驻 php -S 进程）
