#      fastcgi_param  DB_HOST 127.0.0.1;
#      fastcgi_param  DB_PORT 3306;
#      fastcgi_param  DB_NAME mall_db;
#      fastcgi_param  DB_USER mall_user;
#      fastcgi_param  DB_PASS 你的数据库密码;
#      include        fastcgi_params;
#  }
#
#  location ~ ^/admin/adapter/ {
#      fastcgi_pass   unix:/run/php/php8.1-fpm.sock;
#      fastcgi_index  adapter.php;
#      fastcgi_param  SCRIPT_FILENAME /var/www/elect-mall/crmeb/public/adapter.php;
#      fastcgi_param  DB_HOST 127.0.0.1;
#      fastcgi_param  DB_PORT 3306;
#      fastcgi_param  DB_NAME mall_db;
#      fastcgi_param  DB_USER mall_user;
#      fastcgi_param  DB_PASS 你的数据库密码;
#      include        fastcgi_params;
#  }
#
#  注意：adapter.php 内部会把 /api/adapter/ 与 /admin/adapter/ 前缀剥掉后再路由，
#        因此 SCRIPT_FILENAME 固定指向 adapter.php 即可，无需 rewrite。
# =============================================================
